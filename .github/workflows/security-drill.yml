name: Security Drill

on:
  push:
    branches: [bootstrap-v1]
    paths:
      - "supabase/**"
      - "lib/security/**"
      - "app/api/**"
      - "scripts/security-drill.sh"
      - ".github/workflows/security-drill.yml"
      - "HANDOVER.md"
      - "SALE_READINESS.md"
  pull_request:
    paths:
      - "supabase/**"
      - "lib/security/**"
      - "app/api/**"
      - "scripts/security-drill.sh"
      - ".github/workflows/security-drill.yml"
      - "HANDOVER.md"
      - "SALE_READINESS.md"
  workflow_dispatch:

jobs:
  security-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Prove rate-limit and privileged-function boundaries
        shell: bash
        run: bash scripts/security-drill.sh
